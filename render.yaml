services:
  - type: web
    name: abhay-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: ML_ENGINE_URL
        sync: false
      - key: ML_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: static
    name: abhay-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
